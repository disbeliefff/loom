version: "2"
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - revive
  exclusions:
    rules:
      - linters:
          - revive
        text: "should have comment"
      - linters:
          - errcheck
        path: "_test\\.go$"
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: exported
          disabled: false
        - name: unexported-return
          disabled: false
    gosec:
      excludes:
        - G104
