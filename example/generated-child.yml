# Auto-generated DEVELOPMENT build pipeline for: dev

include:
  - project: 'your-org/devops/ci-templates'
    file: 'templates/build/docker-build.yml'
  - project: 'your-org/devops/ci-templates'
    file: 'templates/deploy/gitops-promote.yml'

stages:
  - build
  - gitops-sync


# -----------------------------------------------------------------------------
# Service: AccountingAPI
# -----------------------------------------------------------------------------
build:AccountingAPI:
  extends: .docker-build
  stage: build
  variables:
    IMAGE_NAME: "registry.gitlab.com/org/accounting-api"
    BUILD_CONTEXT: "example/src/Accounting/API"

promote:AccountingAPI:
  extends: .gitops-promote
  stage: gitops-sync
  needs: ["build:AccountingAPI"]
  variables:
    IMAGE_NAME: "registry.gitlab.com/org/accounting-api"
    IMAGE_TAG: "c1dde19dcee40f985b788033f17b3be76ad14cd5"
    KUSTOMIZE_PATH: "apps/accounting/overlays/prod"
    NOTIFY_CHANNEL: "#dev-accounting"


